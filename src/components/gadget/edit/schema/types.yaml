colors:
  - name: brief.color
    type: color
    title: Color
    hint: Main site color

fonts:
  - name: brief.fonts.base
    type: range
    title: Default Font
    hint: Default font for the gadget
    options: fonts

  - name: brief.fonts.heading
    type: range
    title: Heading Font
    hint: Font to use for headings
    options: fonts

  - name: brief.fonts.copy
    type: range
    title: Copy Font
    hint: Font to use for ordinary copy
    options: fonts

flow:
  - brief.orientation
  - brief.wrap
  - brief.justification
  - brief.alignment

grid:
  - brief.orientation
  - brief.justification
  - brief.alignment

layout:
  - name: brief.header
    type: boolean
    title: Header
    hint: Does your layout have a header panel?
  - name: brief.footer
    type: boolean
    title: Footer
    hint: Does your layout have a footer panel?
  - name: brief.aside
    type: boolean
    title: Sidebar
    hint: Does your layout have a sidebar panel?
    
size:
  - brief.size

proximity:
  - name: brief.proximity
    type: range
    title: Proximity
    hint: How closely together are gadgets placed?
    options: proximity

border:
  # TODO change this to borders when we add add'l fields
  #      ex: borders.size, borders.radius
  #      not sure what to call the actual borders themselves
  - name: brief.border
    type: range
    title: Border
    hint: What border do you want for the gadget?
    options: border
  # - brief.size
  # - name: brief.radius

page:
  - name
  - description
  
container:
  - name
  - description

navigation: [ name, description ]

link:

  - name

  - name: brief.style
    title: Style
    hint: How to display the link
    type: enumerable
    options: link-style

  - name: brief.url
    type: url
    title: URL
    hint: The URL for the page

  - name: brief.page
    type: page
    title: Page
    hint: A page from the site

text: [ name, brief.text ]
image: [ name, description, image.url ]
variant:
  - name
  - brief.mode
  - brief.resolution
  - brief.device
  - brief.image.url
icon:
  - name
  - name: brief.style
    title: Style
    type: enumerable
    options: style
    hint: The style of the icon
  - name: brief.icon
    title: Icon
    type: icon
